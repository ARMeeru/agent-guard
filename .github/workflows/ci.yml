name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

# Least-privilege: this workflow only needs to read the repo. It does not
# publish anything, comment on PRs, or push artifacts, so anything beyond
# `contents: read` would be over-scope for a security project.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a force-push / new push to the
# same PR or branch doesn't burn CI minutes on a stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate rules/rules.json
        # The guard ships its rule set as data. A malformed rules.json would
        # silently disable protection, so we fail the build loudly if the
        # file is not valid JSON before running any test.
        run: |
          python -c "import json,sys; json.load(open('rules/rules.json')); print('rules/rules.json: OK')"

      - name: Run test suite
        # Standard-library only project — no `pip install` step needed.
        # tests/test_guard.py has a __main__ block so it runs directly,
        # and also works under pytest if anyone prefers.
        run: python tests/test_guard.py

  eof-newline:
    name: enforce final newline on tracked text files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check every tracked text file ends with a newline
        # Enumerate `git ls-files`, sniff each file for a binary marker
        # (NUL byte in the first 8 KiB), and fail — listing every offender —
        # if any text file's last byte is not LF. Pure bash + coreutils; no
        # Python, no jq. The .editorconfig at the repo root declares the
        # same convention for editors; this job is the enforcement layer.
        run: |
          set -u
          offenders=()
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            # empty files are fine — neither ends with newline nor "should"
            [ -s "$f" ] || continue
            # skip binary files (NUL byte in the first 8 KiB).
            # Use od + grep instead of `grep -q $'\x00'` directly: BSD grep
            # on macOS treats the NUL pattern as a match for every input,
            # which would silently skip every file and break detection.
            if head -c 8192 "$f" | LC_ALL=C od -An -c | grep -q '\\0'; then
              continue
            fi
            # last byte must be LF
            last=$(tail -c 1 "$f" | od -An -c | tr -d ' \n')
            if [ "$last" != "\\n" ]; then
              offenders+=("$f")
            fi
          done < <(git ls-files)

          if [ "${#offenders[@]}" -gt 0 ]; then
            echo "::error::The following tracked text files are missing a final newline:"
            for f in "${offenders[@]}"; do
              echo "::error file=$f::missing final newline"
            done
            exit 1
          fi
          echo "all tracked text files end with a newline"
