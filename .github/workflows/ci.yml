name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

# Least-privilege: this workflow only needs to read the repo. It does not
# publish anything, comment on PRs, or push artifacts, so anything beyond
# `contents: read` would be over-scope for a security project.
permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate rules/rules.json
        # The guard ships its rule set as data. A malformed rules.json would
        # silently disable protection, so we fail the build loudly if the
        # file is not valid JSON before running any test.
        run: |
          python -c "import json,sys; json.load(open('rules/rules.json')); print('rules/rules.json: OK')"

      - name: Run test suite
        # Standard-library only project — no `pip install` step needed.
        # tests/test_guard.py has a __main__ block so it runs directly,
        # and also works under pytest if anyone prefers.
        run: python tests/test_guard.py